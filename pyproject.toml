[project]
name = "cumcm-workbench"
version = "0.1.0"
description = "Reproducible CUMCM modeling and paper workflow"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc3339-validator>=0.1.4,<0.2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.8,<4",
  "pypdf>=4,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests", "toolkit/tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["toolkit/src", "."]
